name: Make Package Public

on:
  workflow_dispatch:

jobs:
  publicize:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH /orgs/libretechio/packages/container/librestream/visibility -f visibility=public || \
          gh api -X PATCH /user/packages/container/librestream/visibility -f visibility=public || true
